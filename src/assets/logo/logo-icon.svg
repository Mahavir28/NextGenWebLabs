<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#EC4899"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded background tile -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <rect width="64" height="64" rx="14" fill="url(#g)" opacity="0.08"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="url(#g)" stroke-width="1.5" opacity="0.3"/>

  <!-- NW monogram scaled to 64×64 -->
  <g filter="url(#glow)">
    <!-- N left vertical -->
    <line x1="14" y1="18" x2="14" y2="46" stroke="url(#g)" stroke-width="3.2" stroke-linecap="square"/>
    <!-- N diagonal -->
    <line x1="14" y1="18" x2="32" y2="46" stroke="url(#g)" stroke-width="3.2" stroke-linecap="square"/>
    <!-- N/W shared vertical -->
    <line x1="32" y1="18" x2="32" y2="46" stroke="url(#g)" stroke-width="3.2" stroke-linecap="square"/>
    <!-- W left down -->
    <line x1="32" y1="18" x2="39" y2="46" stroke="url(#g)" stroke-width="3.2" stroke-linecap="square"/>
    <!-- W center up -->
    <line x1="39" y1="46" x2="44" y2="30" stroke="url(#g)" stroke-width="3.2" stroke-linecap="square"/>
    <!-- W center down -->
    <line x1="44" y1="30" x2="49" y2="46" stroke="url(#g)" stroke-width="3.2" stroke-linecap="square"/>
    <!-- W right vertical -->
    <line x1="49" y1="46" x2="49" y2="18" stroke="url(#g)" stroke-width="3.2" stroke-linecap="square"/>
  </g>

  <!-- Corner dots -->
  <circle cx="14" cy="18" r="2" fill="#EC4899"/>
  <circle cx="49" cy="18" r="2" fill="#06B6D4"/>
</svg>
