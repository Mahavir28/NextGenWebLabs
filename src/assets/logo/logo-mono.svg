<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Orbit ring -->
  <circle cx="100" cy="100" r="88"
    stroke="white" stroke-width="1.5" stroke-linecap="round"
    stroke-dasharray="460 100" stroke-dashoffset="-20" opacity="0.4"/>

  <!-- Inner dashed ring -->
  <circle cx="100" cy="100" r="74"
    stroke="white" stroke-width="0.5" stroke-dasharray="8 6" opacity="0.15"/>

  <!-- NW monogram -->
  <g filter="url(#glow)" opacity="0.95">
    <line x1="62"  y1="68"  x2="62"  y2="132" stroke="white" stroke-width="7" stroke-linecap="square"/>
    <line x1="62"  y1="68"  x2="100" y2="132" stroke="white" stroke-width="7" stroke-linecap="square"/>
    <line x1="100" y1="68"  x2="100" y2="132" stroke="white" stroke-width="7" stroke-linecap="square"/>
    <line x1="100" y1="68"  x2="119" y2="132" stroke="white" stroke-width="7" stroke-linecap="square"/>
    <line x1="119" y1="132" x2="129" y2="100" stroke="white" stroke-width="7" stroke-linecap="square"/>
    <line x1="129" y1="100" x2="138" y2="132" stroke="white" stroke-width="7" stroke-linecap="square"/>
    <line x1="138" y1="132" x2="138" y2="68"  stroke="white" stroke-width="7" stroke-linecap="square"/>
  </g>

  <!-- Corner dots -->
  <circle cx="62"  cy="68"  r="3.5" fill="white" opacity="0.8"/>
  <circle cx="138" cy="68"  r="3.5" fill="white" opacity="0.8"/>
  <circle cx="62"  cy="132" r="3.5" fill="white" opacity="0.6"/>
  <circle cx="138" cy="132" r="3.5" fill="white" opacity="0.6"/>

  <!-- Orbit end dots -->
  <circle cx="162" cy="38" r="3" fill="white" opacity="0.6"/>
  <circle cx="38"  cy="162" r="2" fill="white" opacity="0.4"/>
</svg>
